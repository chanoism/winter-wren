; Adafruit I2C QT Rotary Encoder (Seesaw, 0x36) isolation test.
; No OLED, no LoRa: only the encoder is on the bus (plus the OLED if wired,
; which is skipped at 0x3C).
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    adafruit/Adafruit seesaw Library

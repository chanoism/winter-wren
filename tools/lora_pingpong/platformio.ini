; Standalone SX1262 link test for the Seeed XIAO ESP32S3 + Wio-SX1262 KIT (B2B).
; Flash the SAME sketch to two boards and watch both serial monitors.
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    jgromes/RadioLib@^7.0.0

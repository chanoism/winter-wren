; platformio.ini
; ---------------------------------------------------------------
; Combined firmware for the Seeed XIAO ESP32S3 + Wio-SX1262 KIT:
;   - Real Reticulum (via microReticulum) over SX1262 LoRa at
;     915 MHz, connected via the B2B connector
;   - WiFi promiscuous + BLE Flock Safety detection (ported from
;     esp32_recon.ino)
;   - SSD1306 128x64 I2C OLED status display on D5/D7
;   - Buzzer alert on D6 / GPIO43 (not yet populated)
;
; PORTED from the ESP32 WROOM-32 + hand-wired SX1276 @ 433 MHz build.
; Changes from that version are marked [PORT] below.
; ---------------------------------------------------------------

[env:seeed_xiao_esp32s3]
; [PORT] was [env:esp32dev] / board = esp32dev
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_type = debug

; [PORT] board_build.partitions = huge_app.csv REMOVED.
; That was a workaround for the WROOM-32's 4MB flash. The XIAO has 8MB
; and its default partition table gives a larger app slot than huge_app
; did, so the override is unnecessary here. If a "text section exceeds
; available space" error ever appears, that's the line to bring back.

build_flags =
    -Wall
    -Wno-missing-field-initializers
    -Wno-format

    ; [PORT] Required on a native-USB ESP32-S3. Without these, Serial
    ; output goes nowhere and the board looks dead when it's only mute.
    ; The WROOM-32 didn't need them -- it had a separate CH340 chip.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    -DRNS_USE_FS
    -DUSTORE_USE_UNIVERSALFS

    ; KEEP. Disables persistence for the "known destinations" store.
    ; Root-caused via full TRACE logging on the old hardware:
    ; Identity::remember() fails writing to this specific store, and the
    ; library then reads back from that same broken store via
    ; recall_app_data() immediately before invoking the announce handler,
    ; finding nothing. Raw bytes survive transmission fine (confirmed in
    ; hex dumps of on_incoming/on_outgoing). This flag keeps the lookup
    ; in memory. Nothing about the new hardware changes this -- it was
    ; never a radio problem.
    -DRNS_PERSIST_KNOWN_DESTINATIONS=0

    -DMCU_ESP32

    ; [PORT] was -DBOARD_CUSTOM_WROOM_SX1276
    -DBOARD_XIAO_S3_SX1262

    -DMSGPACK_USE_BOOST=OFF

    ; Bump to RNS_LOG_LEVEL_TRACE when debugging app_data again. Note
    ; that BOTH this compile-time flag and a runtime RNS::loglevel()
    ; call are required -- the log macros compile to no-ops below the
    ; level set here, so the runtime call alone does nothing.
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_INFO

lib_deps =
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    jgromes/RadioLib @ ^7.0.0
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git
    attermann/microReticulum
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit seesaw Library

monitor_filters = esp32_exception_decoder

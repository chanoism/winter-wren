; platformio.ini
; ---------------------------------------------------------------
; Combined firmware for a plain ESP32 WROOM-32 dev board:
;   - Real Reticulum (via microReticulum) over an SX1276 LoRa
;     module at 433 MHz, wired manually per your diagram
;     (NSS5/SCK18/MOSI23/MISO19/RST14/DIO0 26)
;   - WiFi promiscuous + BLE Flock Safety detection (ported from
;     your existing esp32_recon.ino)
;   - SSD1306 128x64 I2C OLED status display (SDA21/SCL22), no
;     buttons required
;   - Buzzer alert on GPIO27, beeps on a confirmed Flock hit
;
; lib_deps below match the microReticulum project's own
; examples/lora_announce/platformio.ini as closely as possible,
; since that's the reference this whole setup is built against.
; The lora_interface library is vendored locally in
; lib/lora_interface/ rather than symlinked, with a new
; BOARD_CUSTOM_WROOM_SX1276 branch added for your wiring.
; ---------------------------------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 115200 instead of a higher speed -- some CH340/CP210x macOS driver
; versions throw "termios.error: Invalid argument" on faster upload
; speeds. Slower but reliable.
upload_speed = 115200
build_type = debug

; Bigger single-app partition -- this firmware (WiFi/BLE detection +
; OLED + Reticulum + RadioLib all combined) is too large for the
; no_ota.csv scheme the reference examples use on smaller boards.
; huge_app.csv is the PlatformIO equivalent of the "Huge APP (3MB No
; OTA/1MB SPIFFS)" option from your Arduino IDE partition-scheme
; gotcha -- same fix, different tool. No OTA slots needed here either
; way, per our earlier dual-boot discussion.
board_build.partitions = huge_app.csv

build_flags =
    -Wall
    -Wno-missing-field-initializers
    -Wno-format
    -DRNS_USE_FS
    -DUSTORE_USE_UNIVERSALFS
    ; Disables persistence specifically for the "known destinations"
    ; store -- traced via full TRACE-level logging to the actual
    ; cause of app_data not reaching the announce handler. The raw
    ; bytes survive transmission fine (confirmed in the hex dump of
    ; on_incoming/on_outgoing), but Identity::remember() fails to
    ; write them to this specific store, and the library then reads
    ; back from that same broken store via recall_app_data() right
    ; before calling our handler -- finding nothing. This flag keeps
    ; that lookup purely in-memory instead, sidestepping the broken
    ; write path. Plain file reads/writes elsewhere (identity key,
    ; time offset) work fine, so this looks specific to this one
    ; storage engine, not a general filesystem problem.
    -DRNS_PERSIST_KNOWN_DESTINATIONS=0
    -DMCU_ESP32
    -DBOARD_CUSTOM_WROOM_SX1276
    -DMSGPACK_USE_BOOST=OFF
    ; Compile-time gate for TRACE/DEBUG log macros -- lowered back
    ; down now that we've root-caused the app_data issue via a full
    ; trace capture. Bump back to RNS_LOG_LEVEL_TRACE if debugging
    ; again.
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_INFO

lib_deps =
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    jgromes/RadioLib @ ^7.0.0
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git
    attermann/microReticulum
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

monitor_filters = esp32_exception_decoder
